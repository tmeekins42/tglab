# Builds and publishes a binary release when a version tag is pushed.
#
#   git tag v0.4.0 && git push origin v0.4.0
#
# Building on a clean GitHub runner rather than a developer machine is the
# point: it proves the archive contains everything, because nothing else is
# installed for it to accidentally depend on. A package that only runs where it
# was built is exactly the failure this is meant to catch.
name: release

on:
  push:
    tags: ['v*']
  # Also runnable by hand, so the packaging can be exercised without minting a
  # tag first -- a tag is hard to retract once pushed.
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release

jobs:
  windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A pinned DXC, rather than whatever the runner's SDK happens to carry.
      #
      # The first published release shipped the runner's SDK copy, whose
      # DxcCreateInstance fails outright: the app started, fell back to the CPU
      # for every algorithm, and looked merely slow. Pinning means the DLLs that
      # ship are a known version rather than a property of the image, and the
      # dxc_smoke test below proves they work before anything is zipped.
      - name: Fetch DXC
        shell: pwsh
        run: |
          $ver = 'v1.8.2502'
          $url = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$ver/dxc_2025_02_20.zip"
          Invoke-WebRequest -Uri $url -OutFile dxc.zip
          Expand-Archive dxc.zip -DestinationPath dxc
          $dir = "$PWD/dxc/bin/x64"
          if (-not (Test-Path "$dir/dxcompiler.dll")) { throw "dxcompiler.dll not in $dir" }
          if (-not (Test-Path "$dir/dxil.dll"))       { throw "dxil.dll not in $dir" }
          "DXC_BIN=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DDXC_COMPILER_DLL="$env:DXC_BIN/dxcompiler.dll"
          -DDXC_DXIL_DLL="$env:DXC_BIN/dxil.dll"

      - name: Build
        run: cmake --build build --config Release

      # The CPU-only suites gate the release: if the language, the pipeline, the
      # filters or the demosaics are broken, nothing should be published.
      - name: Test (CPU suites)
        run: ctest --test-dir build -C Release --output-on-failure -E runtime

      # The runtime suite is reported but does not gate, because a hosted runner
      # has no GPU: D3D12 falls back to WARP and DxcCreateInstance fails
      # outright, so every GPU check fails for reasons that say nothing about
      # the code. Running it anyway is still worth it -- its CPU-side checks
      # (worker thread, cancellation, viewer versions) are real, and a crash
      # here would mean a guard somewhere stopped working, which is exactly the
      # bug this workflow found the first time it ran.
      - name: Test (runtime suite, GPU checks expected to fail)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "build/Release/tglab_runtime_tests.exe" `
                             -NoNewWindow -Wait -PassThru `
                             -RedirectStandardOutput rt-out.txt `
                             -RedirectStandardError  rt-err.txt
          Get-Content rt-out.txt -ErrorAction SilentlyContinue
          Get-Content rt-err.txt -ErrorAction SilentlyContinue
          # An access violation means a guard failed, not that the GPU is
          # absent. That is a real defect and must not pass quietly.
          if ($p.ExitCode -eq -1073741819) {
            throw "runtime suite crashed (access violation), not merely failed"
          }
          Write-Host "runtime suite exit code: $($p.ExitCode)"

      - name: Package
        run: cmake --build build --config Release --target package_release

      # Guard against the packaging silently producing an archive that is
      # missing the runtime DLLs -- the failure a developer machine hides,
      # because the SDK is installed there.
      - name: Verify archive contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/dist/*.zip | Select-Object -First 1
          if (-not $zip) { throw "no archive was produced" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $names = $archive.Entries | ForEach-Object { $_.FullName }
          $archive.Dispose()
          $required = @(
            'tglab.exe', 'dxcompiler.dll', 'dxil.dll',
            'LICENSE', 'READ-ME-FIRST.txt',
            'licenses/libraw-LICENSE.LGPL', 'licenses/libraw-COPYRIGHT',
            'scripts/hello.tgl', 'assets/test.png'
          )
          foreach ($r in $required) {
            if (-not ($names -match [regex]::Escape($r))) {
              throw "archive is missing $r"
            }
          }
          Write-Host "archive contains all $($required.Count) required entries"

      - uses: actions/upload-artifact@v4
        with:
          name: tglab-win64
          path: build/dist/*.zip

      # Only for a real tag: a manual run produces a downloadable artifact but
      # must not create a release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.zip
          generate_release_notes: true
          body: |
            Download the zip below, unzip it anywhere, and run `tglab.exe`.

            Needs 64-bit Windows 10/11 and a Direct3D 12 GPU. If it will not
            start and mentions `VCRUNTIME140.dll`, install the
            [Visual C++ Redistributable](https://aka.ms/vs/17/release/vc_redist.x64.exe).

            Keep `dxcompiler.dll` and `dxil.dll` beside `tglab.exe` — they
            compile the GPU shaders at runtime.
